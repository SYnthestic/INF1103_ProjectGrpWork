<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Grant Audit</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: .8rem; }
    .is-hidden { display: none; }
    [hidden] { display: none !important; }
    input, select, textarea { width: 100%; padding: .4rem; box-sizing: border-box; }
    .flash { background: #fff3cd; padding: .6rem; margin: 1rem 0; border-radius: 4px; }
    nav a, nav button { margin-right: 1rem; }
    pre { background: #f4f4f4; padding: .8rem; overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
td, th { border-bottom: 1px solid #ddd; padding: .4rem; text-align: left; }
form.inline { display: inline; }
    
  </style>
</head>
<body>
  <nav>
    {% if session.username %}
      <a href="{{ url_for('pages.new_audit') }}">New audit</a>
      <a href="{{ url_for('pages.records_page') }}">Records</a>
      <a href="{{ url_for('pages.history') }}">History</a>
      <form action="{{ url_for('pages.logout') }}" method="post" style="display:inline">
        <button>Log out ({{ session.username }})</button>
      </form>
    {% else %}
      <a href="{{ url_for('pages.login') }}">Log in</a>
      <a href="{{ url_for('pages.register') }}">Register</a>
    {% endif %}
  </nav>
  {% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
