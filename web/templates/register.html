{% extends "base.html" %}
{% block content %}
<h1>Register</h1>
<form method="post">
  <label>Username <span class="hint">3-20 letters, digits or _ (not case-sensitive)</span>
    <input name="username" required minlength="3" maxlength="20" autocomplete="username"></label>
  <label>Password <span class="hint">8-64 characters, with at least one letter and one digit</span>
    <input name="password" type="password" required minlength="8" maxlength="64" autocomplete="new-password"></label>
  <p><button>Register</button></p>
</form>
{% endblock %}
